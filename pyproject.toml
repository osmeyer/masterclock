[project]
name = "masterclock"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Donald Osmeyer", email = "d_osmeyer@hotmail.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/masterclock"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "hypothesis>=6.168.2",
    "mutmut>=3.8.0",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "radon>=6.0.1",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0.12.20260906",
    "xenon>=0.9.3",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["A", "ARG", "B", "C4", "C90", "D", "E", "F", "I", "N", "PTH", "RET", "RUF", "S", "SIM", "UP", "W"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
disallow_any_unimported = true
extra_checks = true
files = ["src"]
