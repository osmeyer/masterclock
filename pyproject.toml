[project]
name = "masterclock"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Donald Osmeyer", email = "d_osmeyer@hotmail.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
]

[project.scripts]
das_processor = "masterclock.das_processor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/masterclock"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "hypothesis>=6.168.2",
    "mutmut>=3.8.0",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "radon>=6.0.1",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0.12.20260906",
    "xenon>=0.9.3",
]

[tool.ruff]
target-version = "py314"
# Folders holding the project's own modules, so imports of them are grouped
# apart from third-party ones.
src = ["scripts", "src"]

[tool.ruff.lint]
select = ["A", "ARG", "B", "C4", "C90", "D", "E", "F", "I", "N", "PTH", "RET", "RUF", "S", "SIM", "UP", "W"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pep8-naming]
# Commonly accepted one-letter names of mathematical and scientific terms
# keep the form the science writes them in, so the naming rules let these
# through wherever they appear: M, the estimator's time constant.
ignore-names = ["M"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
disallow_any_unimported = true
extra_checks = true
files = ["scripts", "src", "tests"]
mypy_path = "scripts"

[tool.pytest.ini_options]
testpaths = ["src", "scripts", "tests"]
pythonpath = ["scripts"]
python_files = ["test_*.py"]
addopts = ["--doctest-modules", "-rs", "--no-fold-skipped", "--cov", "--cov-report=term-missing", "--cov-fail-under=100"]

[tool.coverage.run]
branch = true
relative_files = true
source = ["src", "scripts", "tests"]

[tool.coverage.report]
show_missing = true

[tool.mutmut]
source_paths = ["src"]
also_copy = ["scripts/", "etc/"]
pytest_add_cli_args = ["--no-cov"]
